# 可选：本机已有 Docker 时，快速启动 MySQL 8.4 练习实例
# 用法见同目录 README.md

services:
  mysql:
    image: mysql:8.4
    container_name: study-mysql-stage01
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_change_me
      MYSQL_DATABASE: study_mysql_stage01
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - study_mysql_stage01_data:/var/lib/mysql

volumes:
  study_mysql_stage01_data:
